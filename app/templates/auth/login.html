{% extends "base.html" %}
{% block title %}Log in — SOPilot{% endblock %}
{% block shell_modifier %}sp-shell--narrow{% endblock %}
{% block content %}
  <div class="sp-eyebrow">Access</div>
  <h1>Log in to SOPilot</h1>
  <p>Grounded answers from your organization's procedures — nothing else.</p>

  <div class="sp-card">
    <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
      <div class="sp-field">
        <label for="email">Work email</label>
        <input type="email" id="email" name="email" value="{{ email or '' }}" required autofocus>
      </div>
      <div class="sp-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="sp-btn sp-btn--block">Log in</button>
    </form>
  </div>

  <div class="sp-form-foot">
    New here? <a href="{{ url_for('auth.signup') }}">Create an account</a>
  </div>
{% endblock %}
